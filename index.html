<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flip Clock</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --digit-color: #e3eed7;
    --card-bg: #0b120e;
    --glow-rgb: 90,170,110;
    --panel-1: #55795e; --panel-2: #33503c;
    --panel-3: #1a2c20; --panel-4: #0c1510;
    --knob-a: #4a5a4c; --knob-b: #1d2620;
    --knob-c: #33423a; --knob-d: #131a15;
    --card-h: min(40vh, 300px);
    --card-w: calc(var(--card-h) * 0.72);
    --radius: calc(var(--card-h) * 0.12);
    --flip-half: 310ms;
    --glow: 1;
  }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #060806;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
    background-image: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(60,100,70,.22), transparent 70%);
    background-size: cover; background-position: center;
  }

  .housing {
    position: relative;
    padding: calc(var(--card-h) * 0.20);
    border-radius: calc(var(--card-h) * 0.26);
    background: linear-gradient(165deg, #2e3134 0%, #1a1c1e 40%, #0e1012 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      inset 0 -2px 6px rgba(0,0,0,.9),
      0 0 0 1px rgba(0,0,0,.8),
      0 40px 90px rgba(0,0,0,.85),
      0 0 calc(140px * var(--glow)) rgba(var(--glow-rgb), calc(.18 * var(--glow)));
    transition: padding .3s ease, background .3s ease, box-shadow .3s ease, border-radius .3s ease;
  }
  .panel {
    position: relative;
    padding: calc(var(--card-h) * 0.17) calc(var(--card-h) * 0.19);
    border-radius: calc(var(--card-h) * 0.16);
    background: radial-gradient(ellipse 70% 90% at 50% 35%,
      var(--panel-1) 0%, var(--panel-2) 35%, var(--panel-3) 65%, var(--panel-4) 100%);
    box-shadow:
      inset 0 0 0 2px rgba(0,0,0,.65),
      inset 0 2px 20px rgba(0,0,0,.55),
      inset 0 -20px 60px rgba(0,0,0,.55),
      0 0 calc(60px * var(--glow)) rgba(var(--glow-rgb), calc(.12 * var(--glow)));
    cursor: pointer;
    transition: filter .15s, padding .3s ease, background .3s ease, box-shadow .3s ease, border-radius .3s ease;
  }
  .panel:hover { filter: brightness(1.06); }

  .clock { display: flex; align-items: center; justify-content: center; }
  .group { display: flex; }

  .card {
    position: relative;
    width: var(--card-w); height: var(--card-h);
    margin-right: calc(var(--card-h) * 0.03);
    border-radius: var(--radius);
    background: var(--card-bg);
    perspective: calc(var(--card-h) * 3);
    box-shadow:
      inset 0 0 0 2px #040704,
      inset 0 0 24px rgba(0,0,0,.9),
      0 6px 14px rgba(0,0,0,.55);
    transition: width .25s ease, margin-right .25s ease, opacity .25s ease, background .3s ease, box-shadow .3s ease;
    isolation: isolate;
  }
  .card:last-child { margin-right: 0; }

  .half {
    position: absolute; left: 0; width: 100%; height: 50%;
    overflow: hidden; backface-visibility: hidden;
    background: var(--card-bg);
    transition: background .3s ease;
  }
  .half.static-top,    .half.flap-top    { top: 0;    border-radius: var(--radius) var(--radius) 0 0; }
  .half.static-bottom, .half.flap-bottom { bottom: 0; border-radius: 0 0 var(--radius) var(--radius); }
  .static-top, .static-bottom { z-index: 1; }
  .flap-top    { z-index: 3; transform-origin: 50% 100%; transform: rotateX(-90deg); }
  .flap-bottom { z-index: 3; transform-origin: 50% 0%;   transform: rotateX(90deg); }

  .digit {
    position: absolute; left: 0; width: 100%; height: 200%;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--card-h) * 0.86);
    font-weight: 500; line-height: 1;
    color: var(--digit-color);
    text-shadow: 0 0 22px rgba(var(--glow-rgb), .35);
    -webkit-font-smoothing: antialiased;
    transition: color .3s ease, text-shadow .3s ease;
  }
  .static-top .digit,    .flap-top .digit    { top: 0; }
  .static-bottom .digit, .flap-bottom .digit { bottom: 0; }

  .seam {
    position: absolute; top: 50%; left: 0;
    width: 100%; height: 3px; margin-top: -1.5px;
    background: rgba(0,0,0,.85);
    box-shadow: 0 0 4px rgba(0,0,0,.9);
    z-index: 4; pointer-events: none;
  }

  @keyframes flipTop    { from { transform: rotateX(0deg);   filter: brightness(1); }    to { transform: rotateX(-90deg); filter: brightness(0.35); } }
  @keyframes flipBottom { from { transform: rotateX(90deg);  filter: brightness(0.35); } to { transform: rotateX(0deg);   filter: brightness(1); } }
  .card.flipping .flap-top    { animation: flipTop    var(--flip-half) ease-in  forwards; }
  .card.flipping .flap-bottom { animation: flipBottom var(--flip-half) ease-out var(--flip-half) forwards; }

  .colon {
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    gap: calc(var(--card-h) * 0.16);
    padding: 0 calc(var(--card-h) * 0.10);
    height: var(--card-h);
  }
  .colon i {
    display: block;
    width:  calc(var(--card-h) * 0.085);
    height: calc(var(--card-h) * 0.085);
    border-radius: 50%;
    background: var(--digit-color);
    box-shadow: 0 0 16px rgba(var(--glow-rgb), .6);
    transition: opacity .3s, background .3s ease, box-shadow .3s ease;
  }
  .colon.blink i { opacity: .25; }

  .knob {
    position: absolute; top: 50%; right: calc(var(--card-h) * -0.10);
    transform: translateY(-50%);
    width:  calc(var(--card-h) * 0.30);
    height: calc(var(--card-h) * 0.62);
    border-radius: calc(var(--card-h) * 0.06);
    background-image:
      linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.5)),
      repeating-linear-gradient(90deg,
        var(--knob-a) 0px,  var(--knob-a) 3px,
        var(--knob-b) 3px,  var(--knob-b) 7px,
        var(--knob-c) 7px,  var(--knob-c) 9px,
        var(--knob-d) 9px,  var(--knob-d) 13px);
    background-position: 0 0, var(--ridge, 0px) 0;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.12),
      inset 0 -2px 6px rgba(0,0,0,.9),
      4px 6px 20px rgba(0,0,0,.7);
    z-index: 10; cursor: grab;
    transition: width .3s ease, height .3s ease, opacity .25s ease;
  }
  .knob:active { cursor: grabbing; }
  .knob::after {
    content: ''; position: absolute; inset: 0;
    border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.15), transparent 30%, transparent 70%, rgba(0,0,0,.4));
  }

  .tabs {
    display: flex; gap: 6px; padding: 8px; border-radius: 20px;
    background: rgba(20,22,20,.9);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.6);
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 10px 26px;
    border: 0; border-radius: 14px; background: transparent;
    color: rgba(200,220,200,.45);
    font: inherit; font-size: 12px; letter-spacing: .05em;
    cursor: pointer;
    transition: color .15s, background .15s;
  }
  .tab:hover { color: rgba(220,235,220,.85); }
  .tab.active { color: #d6ecc9; background: rgba(80,140,90,.18); }
  .tab svg { width: 22px; height: 22px; }
  .tab.active svg { filter: drop-shadow(0 0 6px rgba(150,220,160,.55)); }

  .status {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(200,230,200,.4);
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    pointer-events: none; transition: color .3s; z-index: 50;
  }
  .status.ringing { color: #ff7373; }

  .menu-btn {
    position: fixed; top: 16px; right: 20px;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: rgba(30,34,30,.55);
    color: rgba(220,235,220,.75);
    cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background .15s, color .15s; z-index: 200;
  }
  .menu-btn:hover { background: rgba(50,60,50,.75); color: #e8f5e0; }
  .menu-btn.open  { background: rgba(80,140,90,.35); color: #e8f5e0; }
  .menu-btn svg { width: 20px; height: 20px; }

  .menu {
    position: fixed; top: 64px; right: 20px; width: 340px;
    max-height: calc(100vh - 90px); overflow-y: auto;
    padding: 8px; border-radius: 16px;
    background: rgba(18,22,18,.94);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.06),
      0 0 0 1px rgba(255,255,255,.05),
      0 20px 60px rgba(0,0,0,.75);
    color: #d8e8d0; font-size: 13px;
    z-index: 199;
    opacity: 0; transform: translateY(-8px) scale(.97); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    transform-origin: top right;
  }
  .menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

  .menu-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 10px 12px; border-radius: 10px;
  }
  .menu-row + .menu-row { border-top: 1px solid rgba(255,255,255,.05); }
  .menu-row.col { flex-direction: column; align-items: stretch; gap: 8px; }
  .menu-label {
    color: rgba(220,235,220,.85);
    font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
  }
  .menu-hint {
    font-size: 10px; color: rgba(255,180,80,.85);
    letter-spacing: .05em; text-transform: uppercase;
  }

  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch i {
    position: absolute; inset: 0; border-radius: 22px;
    background: rgba(255,255,255,.12); cursor: pointer;
    transition: background .2s;
  }
  .switch i::before {
    content: ''; position: absolute;
    top: 3px; left: 3px; width: 16px; height: 16px;
    border-radius: 50%; background: #d8e8d0;
    transition: transform .2s, background .2s;
    box-shadow: 0 2px 4px rgba(0,0,0,.5);
  }
  .switch input:checked + i { background: var(--digit-color); }
  .switch input:checked + i::before { transform: translateX(18px); background: #0b120e; }

  .file-btn, .text-btn {
    display: inline-flex; align-items: center;
    padding: 6px 12px;
    border: 0; border-radius: 8px;
    background: rgba(255,255,255,.08);
    color: #d8e8d0; font: inherit; font-size: 12px;
    cursor: pointer;
    transition: background .12s, opacity .12s;
  }
  .file-btn:hover, .text-btn:hover { background: rgba(255,255,255,.15); }
  .file-btn input { display: none; }
  .text-btn:disabled { opacity: .35; cursor: not-allowed; }

  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch {
    width: 28px; height: 28px;
    border: 2px solid transparent; border-radius: 50%;
    padding: 0; cursor: pointer;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 2px rgba(0,0,0,.15);
    transition: transform .12s, border-color .12s;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active { border-color: #d8e8d0; box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 0 12px rgba(220,235,220,.5); }

  /* Preset / GIF tile grids */
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .tile {
    aspect-ratio: 1;
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 0; cursor: pointer;
    background-size: cover; background-position: center;
    box-shadow: 0 0 0 1px rgba(0,0,0,.5);
    transition: transform .12s, border-color .12s;
    position: relative; overflow: hidden;
  }
  .tile:hover { transform: scale(1.06); }
  .tile.active { border-color: var(--digit-color); box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 0 14px rgba(220,235,220,.45); }
  .tile-empty {
    aspect-ratio: 1;
    display: grid; place-items: center;
    border-radius: 8px;
    background: rgba(255,180,80,.08);
    border: 1px dashed rgba(255,180,80,.4);
    color: rgba(255,180,80,.7);
    font-size: 10px; text-align: center; line-height: 1.2;
    padding: 4px;
  }

  .seg {
    display: inline-flex; padding: 3px;
    border-radius: 9px; background: rgba(255,255,255,.06); gap: 2px;
  }
  .seg button {
    padding: 5px 12px;
    border: 0; border-radius: 7px; background: transparent;
    color: rgba(220,235,220,.55); font: inherit; font-size: 12px;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .seg button:hover { color: #d8e8d0; }
  .seg button.active { background: rgba(255,255,255,.12); color: var(--digit-color); }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 4px;
    background: rgba(255,255,255,.12); outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--digit-color); cursor: pointer;
    box-shadow: 0 0 8px rgba(var(--glow-rgb), .5);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border: 0; border-radius: 50%;
    background: var(--digit-color); cursor: pointer;
  }

  body.minimal .housing { padding: 0; background: transparent; box-shadow: none; border-radius: 0; }
  body.minimal .panel { padding: 0; background: transparent; box-shadow: none; border-radius: 0; cursor: default; }
  body.minimal .panel:hover { filter: none; }
  body.minimal .knob { opacity: 0; pointer-events: none; }

  /* Glass mode — image backgrounds only */
  body.has-bg .housing {
    background: linear-gradient(165deg, rgba(20,22,24,.45), rgba(8,10,10,.45));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      inset 0 -2px 6px rgba(0,0,0,.7),
      0 0 0 1px rgba(0,0,0,.5),
      0 40px 90px rgba(0,0,0,.65),
      0 0 calc(140px * var(--glow)) rgba(var(--glow-rgb), calc(.18 * var(--glow)));
  }
  body.has-bg .panel {
    background: radial-gradient(ellipse 70% 90% at 50% 35%,
      rgba(90,130,100,.22) 0%, rgba(50,80,60,.20) 35%,
      rgba(20,35,25,.18) 65%, rgba(8,15,10,.22) 100%);
    box-shadow:
      inset 0 0 0 2px rgba(0,0,0,.4),
      inset 0 2px 20px rgba(0,0,0,.35),
      inset 0 -20px 60px rgba(0,0,0,.35),
      0 0 calc(60px * var(--glow)) rgba(var(--glow-rgb), calc(.12 * var(--glow)));
  }
  body.has-bg .card {
    background: rgba(12, 18, 12, 0.22);
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    box-shadow:
      inset 0 0 0 1.5px rgba(255,255,255,.14),
      inset 0 2px 12px rgba(255,255,255,.05),
      inset 0 -14px 30px rgba(0,0,0,.28),
      0 8px 22px rgba(0,0,0,.45);
  }
  body.has-bg .half { background: transparent; }
  body.has-bg .static-top,    body.has-bg .flap-top    { background: rgba(255,255,255,.03); }
  body.has-bg .static-bottom, body.has-bg .flap-bottom { background: rgba(0,0,0,.07); }
  body.has-bg .digit {
    text-shadow: 0 0 22px rgba(var(--glow-rgb), .55), 0 2px 6px rgba(0,0,0,.55);
  }
</style>
</head>
<body>

  <button class="menu-btn" id="menuBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
    </svg>
  </button>

  <div class="menu" id="menu">
    <div class="menu-row">
      <span class="menu-label">Flat clock</span>
      <label class="switch"><input type="checkbox" id="flatToggle" checked><i></i></label>
    </div>
    <div class="menu-row">
      <span class="menu-label">Sounds</span>
      <label class="switch"><input type="checkbox" id="soundToggle" checked><i></i></label>
    </div>

    <div class="menu-row col">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="menu-label">Presets</span>
        <button class="text-btn" id="presetClear" style="padding:4px 10px;font-size:11px;">None</button>
      </div>
      <div class="tile-grid" id="presetGrid"></div>
    </div>

    <div class="menu-row col">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="menu-label">GIF wallpapers</span>
        <span class="menu-hint">add via code</span>
      </div>
      <div class="tile-grid" id="gifGrid"></div>
      <div style="font-size:10px;color:rgba(220,235,220,.35);line-height:1.4;">
        Paste direct .gif URLs into <code style="color:rgba(255,180,80,.9);">GIF_PRESETS</code> at the top of the script.
      </div>
    </div>

    <div class="menu-row">
      <span class="menu-label">Upload image</span>
      <div style="display:flex;gap:6px;">
        <label class="file-btn">Choose<input type="file" id="bgUpload" accept="image/*,image/gif"></label>
        <button class="text-btn" id="bgClear">Clear</button>
      </div>
    </div>

    <div class="menu-row col">
      <span class="menu-label">Color</span>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="menu-row">
      <span class="menu-label">Time format</span>
      <div class="seg">
        <button data-fmt="12" class="active">12h</button>
        <button data-fmt="24">24h</button>
      </div>
    </div>

    <div class="menu-row col">
      <span class="menu-label">Music</span>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
        <label class="file-btn">Load<input type="file" id="musicUpload" accept="audio/*"></label>
        <button class="text-btn" id="musicPlay" disabled>Play</button>
        <button class="text-btn" id="musicClear" disabled>Clear</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:11px;color:rgba(220,235,220,.5);letter-spacing:.05em;">VOL</span>
        <input type="range" id="musicVol" min="0" max="1" step="0.01" value="0.5" style="flex:1;">
      </div>
      <div id="musicName" style="font-size:11px;color:rgba(220,235,220,.4);word-break:break-all;">No track loaded</div>
    </div>
  </div>

  <div class="status" id="status">Clock</div>

  <div class="housing">
    <div class="panel" id="panel"><div class="clock" id="clock"></div></div>
    <div class="knob" id="knob" title="Drag in a circle"></div>
  </div>

  <div class="tabs">
    <button class="tab" data-mode="alarm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="13" r="7"/><path d="M12 10v3.2l2.2 1.4"/><path d="M5 5.5 6.8 3.7M19 5.5 17.2 3.7"/>
      </svg>Alarm
    </button>
    <button class="tab active" data-mode="clock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/>
      </svg>Clock
    </button>
    <button class="tab" data-mode="stopwatch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="13.5" r="7"/><path d="M12 9.5v4"/><path d="M9.5 3.5h5"/><path d="M18.5 7 20 5.5"/>
      </svg>Stopwatch
    </button>
  </div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   🎬  GIF WALLPAPERS — ADD YOUR OWN HERE
   ─────────────────────────────────────────────────────────────────────
   Paste direct .gif URLs between the brackets below. They'll appear as
   clickable thumbnails in the "GIF wallpapers" section of the menu,
   separate from the presets. Enables glass mode automatically.

   Format (one per line):
       { name: 'Short label', url: 'https://.../file.gif' },

   Example:
       { name: 'Matrix',  url: 'https://media.giphy.com/media/xxx/giphy.gif' },
       { name: 'Neon',    url: 'https://example.com/neon-loop.gif' },

   Leave the array empty to show the "add GIF URLs in the code" hint.
   ═══════════════════════════════════════════════════════════════════════ */
const GIF_PRESETS = [
  // 👇 ADD YOUR GIFs HERE — one per line, keep the comma at the end
  // { name: 'My GIF', url: 'https://example.com/animation.gif' },
  // { name: 'Cool loop', url: 'https://example.com/loop.gif' },
];
/* ═══════════════════════════════════════════════════════════════════════ */

(function () {
  'use strict';

  const FLIP_MS = 620;

  /* ---------- Presets (solid CSS gradients, no glass) ---------- */
  const BG_PRESETS = [
    { name: 'Aurora',  css: 'linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)' },
    { name: 'Sunset',  css: 'linear-gradient(135deg, #ff6e7f 0%, #bfe9ff 100%)' },
    { name: 'Ocean',   css: 'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)' },
    { name: 'Neon',    css: 'linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%)' },

  /* ---------- Sounds ---------- */
  const sounds = {
    ctx: null, enabled: true, _lastClick: 0, _lastTick: 0,

    ensure() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ctx = new AC();
      }
      return this.ctx;
    },
    _run(fn) {
      const ctx = this.ensure();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume().then(() => fn(ctx)).catch(() => {});
      else fn(ctx);
    },
    click() {
      if (!this.enabled) return;
      const now = performance.now();
      if (now - this._lastClick < 18) return;
      this._lastClick = now;
      this._run((ctx) => {
        const t = ctx.currentTime;
        const len = Math.floor(ctx.sampleRate * 0.008);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2);
        const noise = ctx.createBufferSource(); noise.buffer = buf;
        const hpN = ctx.createBiquadFilter(); hpN.type = 'highpass'; hpN.frequency.value = 1400;
        const ng = ctx.createGain(); ng.gain.value = 0.55;
        noise.connect(hpN).connect(ng).connect(ctx.destination);
        noise.start(t);

        const o = ctx.createOscillator();
        o.type = 'square';
        o.frequency.setValueAtTime(2800, t);
        o.frequency.exponentialRampToValueAtTime(1100, t + 0.012);
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 700;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.30, t + 0.001);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.024);
        o.connect(hp).connect(g).connect(ctx.destination);
        o.start(t); o.stop(t + 0.03);
      });
    },
    tick() {
      if (!this.enabled) return;
      const now = performance.now();
      if (now - this._lastTick < 35) return;
      this._lastTick = now;
      this._run((ctx) => {
        const t = ctx.currentTime;
        const o = ctx.createOscillator();
        o.type = 'triangle';
        o.frequency.setValueAtTime(1800, t);
        o.frequency.exponentialRampToValueAtTime(420, t + 0.030);
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3800;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.40, t + 0.002);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.058);
        o.connect(lp).connect(g).connect(ctx.destination);
        o.start(t); o.stop(t + 0.07);

        const len = Math.floor(ctx.sampleRate * 0.005);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2);
        const noise = ctx.createBufferSource(); noise.buffer = buf;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 1.2;
        const ng = ctx.createGain(); ng.gain.value = 0.18;
        noise.connect(bp).connect(ng).connect(ctx.destination);
        noise.start(t);
      });
    }
  };

  ['pointerdown', 'mousedown', 'touchstart', 'keydown'].forEach(ev =>
    window.addEventListener(ev, () => sounds.ensure(), { once: true, capture: true })
  );

  /* ---------- Palettes ---------- */
  const PALETTES = {
    green: { label:'Green', digit:'#e3eed7', cardBg:'#0b120e', glow:'90,170,110',
             panel:['#55795e','#33503c','#1a2c20','#0c1510'], knob:['#4a5a4c','#1d2620','#33423a','#131a15'] },
    red:   { label:'Red',   digit:'#ffd0d0', cardBg:'#140606', glow:'255,90,90',
             panel:['#7a4a4a','#503030','#2c1a1a','#150c0c'], knob:['#5a2a2a','#261010','#422020','#150808'] },
    blue:  { label:'Blue',  digit:'#cfe3ff', cardBg:'#060a14', glow:'90,140,255',
             panel:['#4a5a7a','#303a50','#1a1f2c','#0c0f15'], knob:['#2a3a5a','#10182a','#203048','#08101e'] },
    pink:  { label:'Pink',  digit:'#ffd0e8', cardBg:'#14060e', glow:'255,100,180',
             panel:['#7a4a6a','#503050','#2c1a26','#150c12'], knob:['#5a2a45','#26101e','#422032','#15081a'] },
    black: { label:'Black', digit:'#f5f5f5', cardBg:'#050505', glow:'80,80,80',

    white: { label:'White', digit:'#1a1a1a', cardBg:'#e8e8e8', glow:'255,255,255',
             panel:['#f0f0f0','#e0e0e0','#d0d0d0','#b8b8b8'], knob:['#d8d8d8','#a8a8a8','#c0c0c0','#909090'] }
  };

  /* ---------- FlipCard ---------- */
  class FlipCard {
    constructor(parent, instant = false) {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML =
        '<div class="half static-top"><span class="digit">0</span></div>' +
        '<div class="half static-bottom"><span class="digit">0</span></div>' +
        '<div class="half flap flap-top"><span class="digit">0</span></div>' +
        '<div class="half flap flap-bottom"><span class="digit">0</span></div>' +
        '<div class="seam"></div>';
      parent.appendChild(el);
      this.el = el; this.instant = instant; this.current = '0'; this.timer = null;
      this.st = el.querySelector('.static-top .digit');
      this.sb = el.querySelector('.static-bottom .digit');
      this.ft = el.querySelector('.flap-top .digit');
      this.fb = el.querySelector('.flap-bottom .digit');
    }
    setInstant(v) {
      if (v === this.current) return;
      this.current = v;
      this.st.textContent = v; this.sb.textContent = v;
    }
    flipTo(value) {
      if (value === this.current) return;
      if (this.instant) return this.setInstant(value);
      if (this.timer) { clearTimeout(this.timer); this.timer = null; }
      if (this.el.classList.contains('flipping')) {
        this.el.classList.remove('flipping');
        this.sb.textContent = this.current;
        void this.el.offsetWidth;
      }
      const oldValue = this.current;
      this.current = value;
      this.st.textContent = value;
      this.sb.textContent = oldValue;
      this.ft.textContent = oldValue;
      this.fb.textContent = value;
      void this.el.offsetWidth;
      this.el.classList.add('flipping');
      sounds.tick();
      this.timer = setTimeout(() => {
        this.timer = null;
        this.sb.textContent = value;
        this.el.classList.remove('flipping');
      }, FLIP_MS);
    }
  }

  /* ---------- State ---------- */
  const state = {
    mode: 'clock',
    clockOffsetMs: 0,
    alarm: { h: 7, m: 0, s: 0, on: false },
    ringing: false,
    sw: { running: false, start: 0, elapsed: 0 },
    knobOffset: 0,
    fmt: 12,
    color: 'green',
    minimal: false,
    bgType: 'none',         // 'none' | 'preset' | 'image'
    bgValue: null,
    presetId: null,
    gifId: null
  };

  const clockEl  = document.getElementById('clock');
  const knobEl   = document.getElementById('knob');
  const panelEl  = document.getElementById('panel');
  const statusEl = document.getElementById('status');
  const menuBtn  = document.getElementById('menuBtn');
  const menuEl   = document.getElementById('menu');

  let cards = [], colons = [];

  const makeColon = () => { const c = document.createElement('div'); c.className='colon'; c.innerHTML='<i></i><i></i>'; colons.push(c); return c; };
  const makeGroup = () => { const g = document.createElement('div'); g.className='group'; return g; };

  function build() {
    clockEl.innerHTML = ''; cards = []; colons = [];
    const instantLastPair = (state.mode === 'stopwatch');
    for (let g = 0; g < 3; g++) {
      if (g > 0) clockEl.appendChild(makeColon());
      const group = makeGroup();
      const instant = instantLastPair && g === 2;
      cards.push(new FlipCard(group, instant), new FlipCard(group, instant));
      clockEl.appendChild(group);
    }
    cards.forEach(c => c.setInstant('0'));
  }

  const pad = n => String(n).padStart(2, '0');

  function clockDigits() {
    const d = new Date(Date.now() + state.clockOffsetMs);
    let h = d.getHours();
    if (state.fmt === 12) { h = h % 12; if (h === 0) h = 12; }
    return pad(h) + pad(d.getMinutes()) + pad(d.getSeconds());
  }
  function stopwatchDigits() {
    let ms = state.sw.elapsed;
    if (state.sw.running) ms += Date.now() - state.sw.start;
    const cs  = Math.floor(ms / 10) % 100;
    const sec = Math.floor(ms / 1000) % 60;
    const min = Math.floor(ms / 60000) % 100;
    return pad(min) + pad(sec) + pad(cs);
  }
  function alarmDigits() {
    let h = state.alarm.h;
    if (state.fmt === 12) { h = h % 12; if (h === 0) h = 12; }
    return pad(h) + pad(state.alarm.m) + pad(state.alarm.s);
  }

  function tick() {
    const str =
      state.mode === 'clock'     ? clockDigits()     :
      state.mode === 'stopwatch' ? stopwatchDigits() :
                                   alarmDigits();
    for (let i = 0; i < cards.length && i < str.length; i++) cards[i].flipTo(str[i]);
    const blink = state.mode === 'stopwatch' && !state.sw.running &&
                  state.sw.elapsed > 0 && Math.floor(Date.now() / 500) % 2 === 0;
    colons.forEach(c => c.classList.toggle('blink', blink));
  }
  function loop() { tick(); requestAnimationFrame(loop); }

  function setMode(m) {
    if (state.mode === m) return;
    state.mode = m;
    build();
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === m));
    updateStatus(); tick();
  }

  function updateStatus() {
    if (state.ringing) return;
    if (state.mode === 'clock') {
      const mins = Math.round(state.clockOffsetMs / 60000);
      statusEl.textContent = mins === 0 ? 'Clock' : `Clock ${mins > 0 ? '+' : ''}${mins} min`;
    } else if (state.mode === 'stopwatch') {
      statusEl.textContent = state.sw.running ? 'Stopwatch · running' :
        (state.sw.elapsed > 0 ? 'Stopwatch · paused' : 'Stopwatch · click clock to start');
    } else {
      statusEl.textContent = state.alarm.on
        ? 'Alarm ON · click clock to disarm' : 'Alarm off · click clock to arm';
    }
  }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));

  /* ---------- Panel ---------- */
  panelEl.addEventListener('click', () => {
    sounds.ensure();
    if (state.ringing) { stopRinging(); return; }
    sounds.click();

    if (state.mode === 'stopwatch') {
      if (state.sw.running) { state.sw.elapsed += Date.now() - state.sw.start; state.sw.running = false; }
      else { state.sw.start = Date.now(); state.sw.running = true; }
      updateStatus();
    } else if (state.mode === 'alarm') {
      state.alarm.on = !state.alarm.on;
      updateStatus();
    }
  });

  panelEl.addEventListener('contextmenu', e => {
    if (state.mode === 'stopwatch') {

  /* ---------- Knob ---------- */
  let drag = null;
  const CLICK_RAD = Math.PI / 12;

  knobEl.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation();
    sounds.ensure();
    const r = knobEl.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    drag = { cx, cy, lastAngle: Math.atan2(e.clientY - cy, e.clientX - cx), accumulated: 0, clickAccum: 0 };
    document.body.style.cursor = 'grabbing';
  });

  document.addEventListener('mousemove', e => {
    if (!drag) return;
    const angle = Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx);
    let delta = angle - drag.lastAngle;
    if (delta >  Math.PI) delta -= 2 * Math.PI;
    if (delta < -Math.PI) delta += 2 * Math.PI;
    drag.lastAngle = angle;
    drag.accumulated += delta;

    state.knobOffset += delta * 45;
    knobEl.style.setProperty('--ridge', state.knobOffset + 'px');

    drag.clickAccum += delta;
    while (Math.abs(drag.clickAccum) >= CLICK_RAD) {
      sounds.click();
      drag.clickAccum -= Math.sign(drag.clickAccum) * CLICK_RAD;
    }
    applyKnob((delta / (Math.PI * 2)) * 60);
  });

  document.addEventListener('mouseup', () => {
    if (!drag) return;
    const wasStopwatch = state.mode === 'stopwatch';
    const spunFar = Math.abs(drag.accumulated) > Math.PI * 1.5;
    drag = null;
    document.body.style.cursor = '';
    if (wasStopwatch && spunFar) { state.sw.elapsed = 0; state.sw.running = false; updateStatus(); }
    if (state.mode === 'clock') snapClockOffset();
  });

  function applyKnob(units) {
    if (state.mode === 'clock') {
      state.clockOffsetMs += units * 60000;
      const H12 = 12 * 3600 * 1000;
      if (state.clockOffsetMs >  H12) state.clockOffsetMs =  H12;
      if (state.clockOffsetMs < -H12) state.clockOffsetMs = -H12;
      tick(); updateStatus();
    } else if (state.mode === 'alarm') {
      let total = state.alarm.h * 60 + state.alarm.m;
      total = ((Math.round(total + units) % 1440) + 1440) % 1440;
      state.alarm.h = Math.floor(total / 60);
      state.alarm.m = total % 60;
      state.alarm.s = 0;
      tick(); updateStatus();
    }
  }

  let snapTimer = null;
  function snapClockOffset() {
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => {
      state.clockOffsetMs = Math.round(state.clockOffsetMs / 60000) * 60000;
      tick(); updateStatus();
    }, 250);
  }

  /* ---------- Alarm (unchanged from the version you said was correct) ---------- */
  let audioCtx = null;
  let beepTimer = null;

  function checkAlarm() {
    if (!state.alarm.on || state.ringing) return;
    const d = new Date();
    if (d.getHours()   === state.alarm.h &&
        d.getMinutes() === state.alarm.m &&
        d.getSeconds() === state.alarm.s) {
      startRinging();
    }
  }
  setInterval(checkAlarm, 200);

  function startRinging() {
    state.ringing = true;
    statusEl.textContent = 'ALARM — click to stop';
    statusEl.classList.add('ringing');

    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const beep = () => {
        if (!state.ringing) return;
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(880, t);
        o.frequency.setValueAtTime(1180, t + 0.12);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.30, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
        o.connect(g).connect(audioCtx.destination);
        o.start(t);
        o.stop(t + 0.32);
        beepTimer = setTimeout(beep, 480);
      };
      beep();
    } catch (err) {}
  }

  function stopRinging() {
    state.ringing = false;
    state.alarm.on = false;
    clearTimeout(beepTimer);
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
    statusEl.classList.remove('ringing');
    updateStatus();
    tick();
  }

  /* ---------- Palette ---------- */
  function applyPalette(name) {
    const p = PALETTES[name];
    if (!p) return;
    const r = document.documentElement.style;
    r.setProperty('--digit-color', p.digit);
    r.setProperty('--card-bg', p.cardBg);

  /* ---------- Background system ---------- */
  const VIGNETTE = 'radial-gradient(ellipse at 50% 45%, transparent 25%, rgba(0,0,0,.55) 100%)';

  function applyBackground() {
    const b = document.body.style;

    if (state.bgType === 'none') {
      document.body.classList.remove('has-bg');
      b.backgroundImage = 'radial-gradient(ellipse 70% 60% at 50% 45%, rgba(60,100,70,.22), transparent 70%)';

  /* ---------- Preset tiles ---------- */

  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setFmt(+b.dataset.fmt)));

  /* ---------- Music ---------- */
  const musicAudio = new Audio();
  musicAudio.loop = true;
  musicAudio.volume = 0.5;
  const musicUpload = document.getElementById('musicUpload');
  const musicPlayBtn = document.getElementById('musicPlay');

  const musicNameEl = document.getElementById('musicName');

  function updateMusicUI() {
    const has = !!musicAudio.src;
    musicPlayBtn.disabled = !has;
    musicClearBtn.disabled = !has;
    if (!has) { musicPlayBtn.textContent = 'Play'; musicNameEl.textContent = 'No track loaded'; return; }
    musicPlayBtn.textContent = musicAudio.paused ? 'Play' : 'Pause';
  }
  musicUpload.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    musicAudio.src = URL.createObjectURL(f);
    musicNameEl.textContent = f.name;
    musicAudio.play().then(updateMusicUI).catch(updateMusicUI);
    updateMusicUI();

  musicPlayBtn.addEventListener('click', () => {
    if (!musicAudio.src) return;

  musicVolEl.addEventListener('input', e => { musicAudio.volume = +e.target.value; });
  musicAudio.addEventListener('play', updateMusicUI);
  musicAudio.addEventListener('pause', updateMusicUI);

  /* ---------- Menu ---------- */
  menuBtn.addEventListener('click', e => {
    e.stopPropagation();
    menuEl.classList.toggle('open');
    menuBtn.classList.toggle('open');
    sounds.ensure(); sounds.click();
  });
  document.addEventListener('click', e => {
    if (menuEl.classList.contains('open') && !menuEl.contains(e.target) && e.target !== menuBtn) {
      menuEl.classList.remove('open');
      menuBtn.classList.remove('open');
    }
  });
  menuEl.addEventListener('click', e => e.stopPropagation());

  /* ---------- Keyboard ---------- */
  document.addEventListener('keydown', e => {
    if (e.key === '1') setMode('alarm');
    if (e.key === '2') setMode('clock');
    if (e.key === '3') setMode('stopwatch');
    if (e.key === ' ') { e.preventDefault(); panelEl.click(); }
    if (e.key === 'Escape') { menuEl.classList.remove('open'); menuBtn.classList.remove('open'); }
  });

  /* ---------- Init ---------- */
  applyPalette('green');
  setFmt(12);
  setMinimal(false);
  applyBackground();
  build();
  tick();
  updateStatus();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
